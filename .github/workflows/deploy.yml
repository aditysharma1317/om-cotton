# .github/workflows/deploy.yml
name: Build & Deploy to Hostinger via SFTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out your code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) Install dependencies
      - name: Install dependencies
        run: npm ci

      # 3) Build your React app
      - name: Build production bundle
        env:
          CI: false   # disable treating warnings as errors
        run: npm run build

      # 4) Clean remote public_html folder
      - name: Clean remote public_html
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          script: |
            # remove everything under files/public_html
            rm -rf /home/${{ secrets.HOSTINGER_USERNAME }}/files/public_html/*
            # ensure the folder still exists
            mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/files/public_html

      # 5) Upload build output via SFTP
      - name: Upload build via SFTP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: "build/**"
          target: "/home/${{ secrets.HOSTINGER_USERNAME }}/files/public_html/"