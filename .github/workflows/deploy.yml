name: 🚀 Build & Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main    # or whatever branch you want to auto‑deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) Install dependencies
      - name: Install dependencies
        run: npm ci

      # 3) Build your React app
      - name: Build production bundle
        env:
          CI: false      # disable CRA’s “treat warnings as errors in CI”
        run: npm run build

      # 4) Deploy via FTP
      - name: Deploy build via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}        # e.g. 145.14.152.253 or ftp.omcottons.com
          port: ${{ secrets.FTP_PORT }}          # usually 21
          username: ${{ secrets.FTP_USERNAME }}  # e.g. u863528652.omcottons.com
          password: ${{ secrets.FTP_PASSWORD }}  # your FTP account password
          protocol: ftp                          # or "ftps" if you enable FTPS in hPanel
          local-dir: build                       # your CRA output folder
          server-dir: public_html                # path inside your FTP home

