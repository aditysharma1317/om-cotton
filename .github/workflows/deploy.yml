# .github/workflows/deploy.yml
name: 🚀 Build & Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) Install dependencies
      - name: Install dependencies
        run: npm ci

      # 3) Build production bundle
      - name: Build production bundle
        env:
          CI: false     # disable CRA’s warnings-as-errors
        run: npm run build

      # 4) (Optional) Verify FTP connectivity
      - name: Debug FTP connectivity with lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          echo "Listing remote public_html on 145.14.152.253:21"
          lftp -u "u863528652.omcottons.com","Omcottons@123" \
               -p 21 145.14.152.253 << 'EOF'
            pwd
            ls -la public_html
            bye
          EOF

      # 5) Deploy build via FTP
      - name: Deploy build via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: 145.14.152.253
          port: 21
          username: u863528652.omcottons.com
          password: Omcottons@123
          protocol: ftp
          local-dir: build/        # must end with '/'
          server-dir: public_html/ # must end with '/'
