name: 🚀 Deploy to Hostinger via SFTP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          CI: false
        run: npm run build

      # ←––––– DEBUG STEP –––––→
      - name: Debug SFTP connectivity & path
        # install sshpass + sftp client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          echo "Listing remote directory…"
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" \
            sftp -oStrictHostKeyChecking=no \
                 -P "${{ secrets.HOSTINGER_PORT }}" \
                 "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" << 'EOF'
            pwd
            ls -la /home/${{ secrets.HOSTINGER_USERNAME }}/files/public_html
            quit
          EOF

      - name: Upload build via SFTP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: "build/**"
          target: "/home/${{ secrets.HOSTINGER_USERNAME }}/files/public_html/"
          strip_components: 1
