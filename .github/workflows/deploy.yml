# .github/workflows/deploy.yml
name: 🚀 Build & Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          CI: false      # disable CRA’s warnings-as-errors
        run: npm run build

      # Optional debug
      - name: Debug FTP connectivity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
               -p ${{ secrets.FTP_PORT }} ${{ secrets.FTP_HOST }} \
               -e "pwd; ls -la public_html; bye"

      - name: Deploy build via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: build/         # <-- must end with '/'
          server-dir: public_html/  # <-- must end with '/'

